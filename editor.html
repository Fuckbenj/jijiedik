<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Редактор каталога · Dark Puff</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Spray+Paint&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#070304;--card:#140a0c;--line:#3a1216;--ink:#f6ecec;--mute:#a58a8e;--acc:#ff2233;--ok:#6be28d;
--drip:'Rubik Spray Paint','Russo One',Impact,sans-serif;--body:'Inter',-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(420px 320px at 100% 0,#4a0a14 0,transparent 70%),radial-gradient(380px 300px at 0 100%,#3a0810 0,transparent 70%),var(--bg);
background-attachment:fixed;color:var(--ink);font:400 15px/1.45 var(--body);min-height:100vh;
padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto}
h1{font:400 28px/1.1 var(--drip);margin:0;text-transform:uppercase;color:#fff;text-shadow:0 0 14px #ff223388}
h2{font:400 18px var(--drip);text-transform:uppercase;margin:18px 0 8px;color:var(--mute)}
.back{display:inline-block;color:#ff6b77;font-weight:600;text-decoration:none;padding:2px 0 10px}
.sub{color:var(--mute);margin:4px 0 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.pr{display:flex;gap:12px;align-items:flex-start}
.pr img{width:56px;height:56px;object-fit:cover;border-radius:12px;background:#000;flex:none}
.pr .g{flex:1;min-width:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.off{opacity:.55}
.st{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st div{width:30%;min-width:84px;flex:1}
.st small{display:block;color:var(--mute);font-size:11px;margin-bottom:2px}
.inp,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:#0d0506;color:var(--ink);font:inherit;margin:0 0 8px}
.st .inp{margin:0;padding:8px}
.btn{padding:11px 14px;border-radius:13px;background:var(--acc);color:#fff;border:0;font:600 13px var(--body);text-transform:uppercase;letter-spacing:.04em;box-shadow:0 0 16px #ff223355;cursor:pointer}
.btn.w{width:100%}
.btn:disabled{opacity:.5}
.gh{padding:9px 13px;border-radius:12px;background:none;border:1.5px solid var(--line);color:var(--ink);font:600 13px var(--body);cursor:pointer}
.gh.red{color:#ff6b77;border-color:#7a1b25}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.msg{min-height:20px;font-size:13px;margin:6px 0;color:var(--mute)}
.msg.ok{color:var(--ok)}.msg.err{color:#ff6b77}
.state{text-align:center;padding:60px 10px;color:var(--mute)}.state b{display:block;color:#fff;font:400 24px var(--drip);margin-bottom:8px;text-transform:uppercase}
label.ck{display:block;margin:6px 0 10px}label.ck input{width:auto;margin:0 8px 0 0}
.lab{color:var(--mute);font-size:12px;margin:2px 0 3px}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tiers .inp{padding:8px;margin:0}
</style>
</head>
<body>
<main>
  <a class="back" href="./">← В магазин</a>
  <h1>Каталог</h1>
  <div class="sub">Всё, что вы меняете здесь, сразу видно клиентам. Пустой остаток в городе = товар там не продаётся, 0 = «нет в наличии».</div>
  <div id="app"><div class="state"><b>Загрузка…</b></div></div>
</main>
<script>
const API = "https://roy555.pythonanywhere.com";
const SHOP_SITE = "https://fuckbenj.github.io/jijiedik/";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#070304"); tg.setBackgroundColor("#070304"); } catch (e) {} }
const $ = s => document.querySelector(s);
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const app = $("#app");

let ITEMS = null, CATS = [], TIERS = {}, CITIES = {}, LIQ = "Жижи";
let EDIT = null, TOPEN = false, MSG = "", MSGOK = true, Q = "", UP = "", CONFIRM = null;

const imgUrl = p => !p ? "" : /^\/img\//.test(p) ? API + p : /^images\//.test(p) ? SHOP_SITE + p : "";
const cityList = () => Object.entries(CITIES).sort((a, b) => ["fra","wie","gie"].indexOf(a[0]) - ["fra","wie","gie"].indexOf(b[0]));

function state(title, text){ const d = el("div","state"); d.append(el("b","",title), document.createTextNode(text || "")); app.replaceChildren(d); }

async function call(path, payload){
  const r = await fetch(API + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({initData: tg ? tg.initData : ""}, payload))});
  let j = {}; try { j = await r.json(); } catch (e) {}
  return {r, j};
}
const errText = (r, j) => j && j.message ? j.message : r.status === 403 ? "Нет доступа к редактору каталога." : r.status === 429 ? "Слишком часто, подождите немного." : "Не получилось (" + r.status + ").";
function apply(j){ ITEMS = j.items; CATS = j.categories || []; TIERS = j.tiers || {}; CITIES = j.cities || CITIES; LIQ = j.liquid_cat || LIQ; }
async function act(payload, okMsg){
  try{
    const {r, j} = await call("/catalog/admin", payload);
    if (r.ok && j.ok){ apply(j); MSG = j.notice || okMsg || ""; MSGOK = true; return true; }
    MSG = errText(r, j); MSGOK = false;
  }catch(e){ MSG = "Нет связи с сервером."; MSGOK = false; }
  return false;
}

const newProduct = () => ({id:"", cat:(CATS[0] || LIQ), name:"", sub:"", price:"", color:"#9b6bff", tag:"", puffs:"", strength:"", desc:"", image:"", active:true, stock:{fra:"", wie:"", gie:""}});

// фото: уменьшаем в браузере до 900 px
function shrinkImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#120709"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.86)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad")); };
    img.src = url;
  });
}

function render(){
  if (ITEMS === null) return;
  const out = [];
  // верхняя панель
  const bar = el("div","bar");
  const add = el("button","btn","+ Добавить товар"); add.onclick = () => { EDIT = newProduct(); MSG = ""; UP = ""; render(); window.scrollTo(0, 0); };
  const tb = el("button","gh", TOPEN ? "Скрыть цены наборов" : "Цены наборов жижи"); tb.onclick = () => { TOPEN = !TOPEN; render(); };
  bar.append(add, tb); out.push(bar);
  const m = el("div","msg" + (MSG ? (MSGOK ? " ok" : " err") : ""), MSG); out.push(m);

  if (TOPEN){
    const c = el("div","card"); c.append(el("div","nm","Цена набора жидкостей: сколько всего стоит N штук"), el("div","sub","Пример: 1 шт = 20, 2 шт = 36 (общая сумма за 2 штуки). Пустое поле = такого набора нет."));
    const g = el("div","tiers"), ins = [];
    for (let n = 1; n <= 10; n++){ const w = el("div"), i = el("input","inp"); i.type = "number"; i.step = "0.5"; i.min = "0"; i.inputMode = "decimal"; i.value = TIERS[String(n)] !== undefined ? TIERS[String(n)] : ""; w.append(el("div","lab",n + " шт"), i); g.append(w); ins.push([n, i]); }
    const sv = el("button","btn w","Сохранить цены наборов"); sv.style.marginTop = "10px";
    sv.onclick = async () => { const t = {}; ins.forEach(([n, i]) => { if (i.value !== "") t[n] = i.value; }); sv.disabled = true; await act({action:"tiers", tiers:t}); render(); };
    c.append(g, sv); out.push(c);
  }

  if (EDIT) out.push(form());

  const q = Q.trim().toLowerCase();
  const sb = el("input","inp"); sb.placeholder = "Поиск по названию"; sb.value = Q; sb.id = "q";
  sb.oninput = () => { Q = sb.value; const p = sb.selectionStart; render(); const n = $("#q"); n.focus(); try{ n.setSelectionRange(p, p); }catch(e){} };
  out.push(sb);

  const items = ITEMS.filter(p => !q || (p.name + " " + p.cat + " " + p.sub).toLowerCase().includes(q));
  if (!items.length) out.push(el("div","sub","Товаров нет."));
  const cats = []; items.forEach(p => { if (!cats.includes(p.cat)) cats.push(p.cat); });
  cats.forEach(cat => {
    out.push(el("h2","", cat + " · " + items.filter(p => p.cat === cat).length));
    items.filter(p => p.cat === cat).forEach(p => out.push(productCard(p)));
  });
  const keepY = window.scrollY;
  app.replaceChildren(...out);
  window.scrollTo(0, keepY);
}

function productCard(p){
  const c = el("div","card" + (p.active ? "" : " off")), row = el("div","pr");
  const im = el("img"); im.src = imgUrl(p.image); im.onerror = () => { im.style.visibility = "hidden"; };
  const g = el("div","g");
  g.append(el("div","nm", p.name + (p.active ? "" : " · СКРЫТ") + (p.tag === "hit" ? " · хит" : p.tag === "new" ? " · новинка" : "")),
    el("div","sub", [p.sub, p.cat === LIQ ? "цена по наборам" : p.price + " €"].filter(Boolean).join(" · ")));
  const st = el("div","st");
  cityList().forEach(([cid, cname]) => {
    const w = el("div"), i = el("input","inp"); i.type = "number"; i.min = "0"; i.inputMode = "numeric"; i.placeholder = "—";
    const cur = p.stock[cid] === null || p.stock[cid] === undefined ? "" : p.stock[cid]; i.value = cur;
    i.onchange = async () => {
      if (String(i.value) === String(cur)) return;
      i.style.borderColor = "#caa";
      const ok = await act({action:"stock", id:p.id, city:cid, qty:i.value});
      if (ok){ i.style.borderColor = "var(--ok)"; setTimeout(render, 450); } else { render(); }
    };
    w.append(el("small","",cname), i); st.append(w);
  });
  g.append(st);
  const ac = el("div","acts");
  const mk = (t, f, cls) => { const b = el("button","gh" + (cls ? " " + cls : ""), t); b.onclick = f; ac.append(b); return b; };
  mk("Изменить", () => { EDIT = JSON.parse(JSON.stringify(p)); MSG = ""; UP = ""; render(); window.scrollTo(0, 0); });
  mk(p.active ? "Скрыть" : "Показать", async () => { await act({action:"toggle", id:p.id}); render(); });
  if (CONFIRM === p.id){
    mk("Точно удалить?", async () => { CONFIRM = null; await act({action:"delete", id:p.id}, "Товар удалён."); render(); }, "red");
    mk("Нет", () => { CONFIRM = null; render(); });
  } else mk("Удалить", () => { CONFIRM = p.id; render(); }, "red");
  g.append(ac); row.append(im, g); c.append(row); return c;
}

function form(){
  const f = EDIT, card = el("div","card");
  const inp = (key, ph, type) => { const i = el("input","inp"); i.type = type || "text"; i.placeholder = ph; if (type === "number"){ i.step = "0.01"; i.inputMode = "decimal"; } i.value = f[key] === undefined ? "" : f[key]; i.oninput = () => { f[key] = i.value; }; return i; };
  const lab = t => el("div","lab",t);
  const catSel = el("select"), cats = Array.from(new Set(CATS.concat([f.cat].filter(Boolean))));
  cats.forEach(c => catSel.append(new Option(c, c))); catSel.append(new Option("+ Новая категория…", "__new")); catSel.value = cats.includes(f.cat) ? f.cat : "__new";
  const catNew = inp("catNew", "Название новой категории"); catNew.style.display = "none"; catNew.value = "";
  catSel.onchange = () => { if (catSel.value === "__new"){ catNew.style.display = ""; f.cat = ""; catNew.focus(); } else { catNew.style.display = "none"; f.cat = catSel.value; } };
  catNew.oninput = () => { f.cat = catNew.value; };
  const tag = el("select"); tag.append(new Option("Без метки", ""), new Option("Хит продаж", "hit"), new Option("Новинка", "new")); tag.value = f.tag || ""; tag.onchange = () => { f.tag = tag.value; };
  const desc = el("textarea"); desc.rows = 3; desc.placeholder = "Описание товара"; desc.value = f.desc || ""; desc.oninput = () => { f.desc = desc.value; };
  const color = el("input"); color.type = "color"; color.value = /^#[0-9a-f]{6}$/i.test(f.color) ? f.color : "#9b6bff"; color.style.cssText = "width:60px;height:42px;padding:2px;margin:0 0 8px;border-radius:10px;border:1.5px solid var(--line);background:#0d0506"; color.oninput = () => { f.color = color.value; };
  const pv = el("img"); pv.style.cssText = "width:90px;height:90px;object-fit:cover;border-radius:12px;background:#000;margin:0 0 8px;display:" + (f.image ? "block" : "none"); pv.src = imgUrl(f.image);
  const file = el("input","inp"); file.type = "file"; file.accept = "image/*"; const ust = el("div","msg",UP);
  file.onchange = async () => {
    if (!file.files[0]) return; ust.className = "msg"; ust.textContent = "Загружаю фото…";
    try{
      const data = await shrinkImage(file.files[0]);
      const {r, j} = await call("/catalog/upload", {data});
      if (r.ok && j.ok){ f.image = j.path; pv.src = imgUrl(j.path); pv.style.display = "block"; UP = "Фото загружено. Нажмите «Сохранить»."; ust.className = "msg ok"; }
      else { UP = errText(r, j); ust.className = "msg err"; }
    }catch(e){ UP = "Не удалось загрузить фото."; ust.className = "msg err"; }
    ust.textContent = UP;
  };
  const noimg = el("button","gh","Убрать фото"); noimg.onclick = () => { f.image = ""; pv.style.display = "none"; UP = ""; ust.textContent = ""; };
  const st = el("div","st");
  cityList().forEach(([cid, cname]) => { const w = el("div"), i = el("input","inp"); i.type = "number"; i.min = "0"; i.inputMode = "numeric"; i.placeholder = "не продаётся"; i.value = f.stock[cid] === null || f.stock[cid] === undefined ? "" : f.stock[cid]; i.oninput = () => { f.stock[cid] = i.value; }; w.append(el("small","",cname), i); st.append(w); });
  const act1 = el("label","ck"); const ac = el("input"); ac.type = "checkbox"; ac.checked = f.active !== false; ac.onchange = () => { f.active = ac.checked; }; act1.append(ac, "Показывать в магазине");
  const save = el("button","btn w", f.id ? "Сохранить товар" : "Создать товар"), cancel = el("button","gh","Отмена"); cancel.style.marginTop = "8px";
  const fm = el("div","msg");
  save.onclick = async () => {
    if (!(f.name || "").trim()){ fm.className = "msg err"; fm.textContent = "Укажите название."; return; }
    if (!(f.cat || "").trim()){ fm.className = "msg err"; fm.textContent = "Выберите или создайте категорию."; return; }
    save.disabled = true; fm.className = "msg"; fm.textContent = "Сохраняю…";
    const ok = await act({action:"save", product:f}); if (ok){ EDIT = null; UP = ""; render(); } else { save.disabled = false; fm.className = "msg err"; fm.textContent = MSG; }
  };
  cancel.onclick = () => { EDIT = null; UP = ""; render(); };
  card.append(el("div","nm", f.id ? "Изменить товар" : "Новый товар"), lab("Название"), inp("name","Например: Xros 6 mini · Black"), lab("Описание под названием (вид, объём)"), inp("sub","Например: Vaporesso · pod-система"),
    lab("Категория"), catSel, catNew, lab("Цена, € (для жидкостей считается по наборам)"), inp("price","Например: 25","number"), lab("Цвет карточки"), color, lab("Метка"), tag,
    lab("Крепость (необязательно)"), inp("strength","Например: 5%"), lab("Количество тяг (необязательно)"), inp("puffs","Например: 6000 тяг"), lab("Описание"), desc,
    lab("Фото (любое, само уменьшится)"), pv, file, ust, noimg, lab("Остатки по городам"), st, act1, save, cancel, fm);
  return card;
}

(async function start(){
  if (!tg || !tg.initData){ state("Откройте из Telegram", "Редактор каталога работает только внутри Telegram: магазин → Профиль → «Редактор каталога»."); return; }
  try{
    const {r, j} = await call("/catalog/admin", {action:"list"});
    if (r.ok && j.ok){ apply(j); render(); }
    else if (r.status === 403) state("Нет доступа", "Эта страница только для редакторов каталога. Если вас назначили, закройте и снова откройте магазин.");
    else state("Ошибка", errText(r, j));
  }catch(e){ state("Нет связи", "Проверьте интернет и откройте страницу ещё раз."); }
})();
</script>
</body>
</html>
