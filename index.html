<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Каталог жидкостей</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1b1b1b);
      --hint: var(--tg-theme-hint-color, #7a7a7a);
      --card: var(--tg-theme-secondary-bg-color, #f1f3f5);
      --accent: var(--tg-theme-button-color, #2481cc);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 14px calc(20px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .note { color: var(--hint); font-size: 13px; margin: 0 0 18px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .card { background: var(--card); border-radius: 14px; overflow: hidden; }
    .photo {
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #cfd8dc, #eceff1);
      display: flex; align-items: center; justify-content: center;
      color: var(--hint); font-size: 13px;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .info { padding: 10px 12px 12px; }
    .name { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
    .desc { font-size: 12px; color: var(--hint); margin: 0 0 6px; }
    .price { font-size: 16px; font-weight: 700; color: var(--accent); }
    header, .grid { max-width: 720px; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Жидкости для вейпа</h1>
    <p class="note">Только для лиц старше 18 лет.</p>
  </header>

  <div class="grid" id="grid"></div>

  <script>
    // === РЕДАКТИРУЙТЕ ЗДЕСЬ ===
    // image: путь к картинке (положите файлы в папку images рядом с этим файлом)
    const products = [
      { name: "Название жидкости 1", desc: "Вкус, объём, крепость", price: 500, image: "images/1.jpg" },
      { name: "Название жидкости 2", desc: "Вкус, объём, крепость", price: 550, image: "images/2.jpg" },
      { name: "Название жидкости 3", desc: "Вкус, объём, крепость", price: 600, image: "images/3.jpg" },
      { name: "Название жидкости 4", desc: "Вкус, объём, крепость", price: 450, image: "images/4.jpg" },
      { name: "Название жидкости 5", desc: "Вкус, объём, крепость", price: 700, image: "images/5.jpg" },
      { name: "Название жидкости 6", desc: "Вкус, объём, крепость", price: 520, image: "images/6.jpg" }
    ];
    const currency = "₽";
    // ===========================

    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const grid = document.getElementById("grid");
    products.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";

      const photo = document.createElement("div");
      photo.className = "photo";
      const img = document.createElement("img");
      img.src = p.image;
      img.alt = p.name;
      img.onerror = () => { photo.textContent = "Фото"; };
      photo.appendChild(img);

      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML =
        '<p class="name"></p><p class="desc"></p><div class="price"></div>';
      info.querySelector(".name").textContent = p.name;
      info.querySelector(".desc").textContent = p.desc;
      info.querySelector(".price").textContent = p.price + " " + currency;

      card.append(photo, info);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
