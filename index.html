<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Моё мини-приложение</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1b1b1b);
      --hint: var(--tg-theme-hint-color, #7a7a7a);
      --link: var(--tg-theme-link-color, #2481cc);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --card: var(--tg-theme-secondary-bg-color, #f1f3f5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { margin: 0 0 16px; color: var(--hint); }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card b { color: var(--text); }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--button);
      color: var(--button-text);
      font-size: 16px;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Привет!</h1>
    <p>Это стартовая страница вашего Telegram Mini App. Здесь можно заменить текст на свой и добавлять нужные разделы.</p>

    <div class="card">
      Вы открыли приложение как: <b id="user">гость (вне Telegram)</b>
    </div>

    <button id="btn">Нажми меня</button>
  </main>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (user) {
        document.getElementById("title").textContent = "Привет, " + user.first_name + "!";
        document.getElementById("user").textContent =
          user.first_name + (user.username ? " (@" + user.username + ")" : "");
      }
    }

    document.getElementById("btn").addEventListener("click", () => {
      if (tg && tg.showAlert) {
        tg.showAlert("Кнопка работает!");
      } else {
        alert("Кнопка работает!");
      }
    });
  </script>
</body>
</html>
